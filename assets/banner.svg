<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08090d"/>
      <stop offset="50%" stop-color="#12131a"/>
      <stop offset="100%" stop-color="#090a0f"/>
    </linearGradient>

    <linearGradient id="flameGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9f1239"/>
      <stop offset="50%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e11d48" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#e11d48" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Filters & Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="glow-gold" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#262a36" stroke-width="0.75" stroke-opacity="0.3"/>
    </pattern>

    <style>
      @keyframes flamePulse {
        0%, 100% { transform: scale(1); filter: drop-shadow(0 0 12px rgba(225,29,72,0.6)); }
        50% { transform: scale(1.04); filter: drop-shadow(0 0 24px rgba(245,158,11,0.85)); }
      }
      @keyframes orbitSpin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes blinkCursor {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      @keyframes beamMove {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(200%); }
      }
      @keyframes dotPulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.4; transform: scale(0.85); }
      }

      .animated-flame {
        transform-origin: 155px 190px;
        animation: flamePulse 3.5s ease-in-out infinite;
      }
      .animated-orbit {
        transform-origin: 155px 190px;
        animation: orbitSpin 28s linear infinite;
      }
      .cursor {
        animation: blinkCursor 1s infinite;
      }
      .dot-live {
        transform-origin: 1115px 55px;
        animation: dotPulse 2s ease-in-out infinite;
      }
      .font-title {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        font-weight: 900;
        letter-spacing: -1.5px;
      }
      .font-mono {
        font-family: 'JetBrains Mono', 'Fira Code', Menlo, Monaco, Consolas, monospace;
      }
      .font-body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="420" rx="20" fill="url(#bgGrad)" />
  <rect width="1200" height="420" rx="20" fill="url(#grid)" />

  <!-- Outer Border Frame -->
  <rect x="2" y="2" width="1196" height="416" rx="18" fill="none" stroke="url(#borderGrad)" stroke-width="1.8" />

  <!-- Orbit Ring around Flame -->
  <g class="animated-orbit">
    <circle cx="155" cy="190" r="105" fill="none" stroke="#e11d48" stroke-opacity="0.25" stroke-dasharray="8 12" stroke-width="1.5" />
    <circle cx="260" cy="190" r="4.5" fill="#f59e0b" filter="url(#glow-gold)" />
    <circle cx="50" cy="190" r="3.5" fill="#e11d48" filter="url(#glow)" />
  </g>

  <!-- Flame Icon / Emblem -->
  <g class="animated-flame">
    <!-- Outer Flame Petal -->
    <path d="M155,90 C175,130 215,160 215,205 C215,245 188,275 155,275 C122,275 95,245 95,205 C95,165 130,130 155,90 Z" 
          fill="url(#flameGrad)" />
    <!-- Inner Flame Core -->
    <path d="M155,145 C168,170 190,195 190,220 C190,245 174,265 155,265 C136,265 120,245 120,220 C120,195 140,170 155,145 Z" 
          fill="#fef08a" opacity="0.9" />
    <!-- Center Core Sparkle -->
    <circle cx="155" cy="225" r="14" fill="#ffffff" opacity="0.95" filter="url(#glow-gold)"/>
  </g>

  <!-- Brand Typography -->
  <g transform="translate(300, 115)">
    <!-- Main Title -->
    <text x="0" y="0" class="font-title" font-size="56" fill="#ffffff">
      SiPen<tspan fill="url(#flameGrad)">Dosa</tspan>
    </text>
    
    <!-- Version Tag -->
    <rect x="250" y="-42" width="94" height="28" rx="6" fill="#9f1239" fill-opacity="0.3" stroke="#e11d48" stroke-width="1.2"/>
    <text x="297" y="-23" class="font-mono" font-size="13" font-weight="700" fill="#fda4af" text-anchor="middle">v1.0.0</text>

    <!-- Subtitle -->
    <text x="2" y="38" class="font-body" font-size="20" font-weight="600" fill="#f59e0b">
      Sistem Pengingat Dosen Saatnya — Universal Multi-Platform
    </text>

    <!-- Persona Quote -->
    <text x="2" y="70" class="font-body" font-size="15" font-style="italic" fill="#94a3b8">
      "Asisten cerdas yang rela 'berdosa' demi mengingatkan dosen agar mahasiswa tidak perlu merasa sungkan."
    </text>

    <!-- Architecture & Platform Badges Pill Group -->
    <g transform="translate(2, 105)">
      <!-- Badge 1: Go Core -->
      <g>
        <rect x="0" y="0" width="112" height="30" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
        <circle cx="16" cy="15" r="4.5" fill="#10b981"/>
        <text x="28" y="20" class="font-mono" font-size="12" font-weight="600" fill="#e2e8f0">Go 1.27 Core</text>
      </g>
      <!-- Badge 2: Swift AppKit -->
      <g transform="translate(122, 0)">
        <rect x="0" y="0" width="124" height="30" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
        <circle cx="16" cy="15" r="4.5" fill="#f59e0b"/>
        <text x="28" y="20" class="font-mono" font-size="12" font-weight="600" fill="#e2e8f0">Swift macOS</text>
      </g>
      <!-- Badge 3: C++17 Bridge -->
      <g transform="translate(256, 0)">
        <rect x="0" y="0" width="120" height="30" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
        <circle cx="16" cy="15" r="4.5" fill="#e11d48"/>
        <text x="28" y="20" class="font-mono" font-size="12" font-weight="600" fill="#e2e8f0">C++17 Engine</text>
      </g>
      <!-- Badge 4: Android APK -->
      <g transform="translate(386, 0)">
        <rect x="0" y="0" width="126" height="30" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
        <circle cx="16" cy="15" r="4.5" fill="#10b981"/>
        <text x="28" y="20" class="font-mono" font-size="12" font-weight="600" fill="#e2e8f0">Android Termux</text>
      </g>
      <!-- Badge 5: Zero CGO -->
      <g transform="translate(522, 0)">
        <rect x="0" y="0" width="112" height="30" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
        <circle cx="16" cy="15" r="4.5" fill="#fbbf24"/>
        <text x="28" y="20" class="font-mono" font-size="12" font-weight="600" fill="#e2e8f0">Zero-CGO</text>
      </g>
    </g>

    <!-- Quick Features Checklist -->
    <g transform="translate(4, 162)">
      <text x="0" y="0" class="font-mono" font-size="12.5" fill="#cbd5e1">
        <tspan fill="#10b981">✓</tspan> Smart Anti-Ban Scheduler
        <tspan dx="20" fill="#10b981">✓</tspan> WhatsApp Session QR Sync
        <tspan dx="20" fill="#10b981">✓</tspan> Standalone Windows/macOS/Linux/Android
      </text>
    </g>
  </g>

  <!-- Live Status Badge (Top Right) -->
  <g transform="translate(1000, 36)">
    <rect x="0" y="0" width="155" height="32" rx="16" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <circle class="dot-live" cx="20" cy="16" r="5" fill="#10b981" filter="url(#glow)"/>
    <text x="34" y="21" class="font-mono" font-size="12" font-weight="700" fill="#e2e8f0">ONLINE ENGINE</text>
  </g>

  <!-- Terminal Preview Frame (Right Side) -->
  <g transform="translate(940, 110)">
    <rect width="225" height="235" rx="10" fill="#0b0d13" stroke="#2a2e3d" stroke-width="1.2"/>
    <!-- Terminal Title Bar -->
    <path d="M 0 10 C 0 4.477 4.477 0 10 0 L 215 0 C 220.523 0 225 4.477 225 10 L 225 28 L 0 28 Z" fill="#151821"/>
    <circle cx="14" cy="14" r="4" fill="#e11d48"/>
    <circle cx="28" cy="14" r="4" fill="#f59e0b"/>
    <circle cx="42" cy="14" r="4" fill="#10b981"/>
    <text x="112" y="18" class="font-mono" font-size="10" fill="#64748b" text-anchor="middle">terminal.sh</text>

    <!-- Terminal Content Lines -->
    <g transform="translate(14, 48)" class="font-mono" font-size="10.5">
      <text x="0" y="0" fill="#64748b">$ <tspan fill="#38bdf8" fill-opacity="0">./sipendosa</tspan><tspan fill="#f59e0b">./sipendosa</tspan></text>
      <text x="0" y="20" fill="#10b981">✓ SQLite WAL ready</text>
      <text x="0" y="38" fill="#10b981">✓ WA Client hooked</text>
      <text x="0" y="56" fill="#cbd5e1">i Scheduler: <tspan fill="#f59e0b">ACTIVE</tspan></text>
      <text x="0" y="74" fill="#64748b">i Next Check: 16:00</text>
      <text x="0" y="92" fill="#10b981">✓ HTTP :8080 open</text>
      <text x="0" y="110" fill="#e11d48">! Queue: 0 pending</text>
      <text x="0" y="130" fill="#e2e8f0">sipen:~$ <tspan class="cursor" fill="#f59e0b">█</tspan></text>
    </g>

    <!-- Terminal Status Footer -->
    <rect x="0" y="205" width="225" height="30" rx="0" fill="#11141c"/>
    <path d="M 0 205 L 225 205 L 225 225 C 225 230.523 220.523 235 215 235 L 10 235 C 4.477 235 0 230.523 0 225 Z" fill="#11141c"/>
    <text x="14" y="224" class="font-mono" font-size="9.5" fill="#64748b">PORT: <tspan fill="#f59e0b">8080</tspan> | PWA: <tspan fill="#10b981">READY</tspan></text>
  </g>
</svg>
