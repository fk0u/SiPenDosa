<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.Title}} — SiPenDosa</title>
    <meta name="description" content="Masuk ke dasbor SiPenDosa — Sistem Pengingat Dosen Saatnya.">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="icon" type="image/png" sizes="64x64" href="/static/img/favicon.png">

    <script>
        (function () {
            var saved = localStorage.getItem('md-theme');
            var theme = saved || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
            document.documentElement.dataset.theme = theme;
        })();
    </script>

    <link rel="stylesheet" href="/static/css/m3.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body style="display:flex; align-items:center; justify-content:center; padding:24px;">

    <div style="width:100%; max-width:400px;" class="md-enter">

        <!-- Brand header -->
        <div class="md-col md-text-center" style="align-items:center; gap:4px; margin-bottom:24px;">
            <div class="md-center" style="width:56px;height:56px;border-radius:var(--md-shape-lg);background:var(--md-sys-color-primary);color:var(--md-sys-color-on-primary);box-shadow:var(--md-elev-2);margin-bottom:8px;">
                <svg style="width:28px;height:28px;" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"/></svg>
            </div>
            <h1 class="md-headline-small">SiPenDosa</h1>
            <p class="md-body-small" style="color:var(--md-sys-color-on-surface-variant);max-width:280px;">Sistem Pengingat Dosen Saatnya — rela "berdosa" demi kepastian perkuliahan.</p>
        </div>

        <!-- Login card (M3 elevated) -->
        <div class="md-card-elevated md-card-xl md-col">
            {{if .FlashError}}
            <div class="md-row" style="align-items:flex-start;gap:10px;padding:12px;border-radius:var(--md-shape-md);background:var(--md-sys-color-error-container);color:var(--md-sys-color-on-error-container);font-size:13px;">
                <svg style="width:18px;height:18px;flex-shrink:0;margin-top:1px;" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                <span>{{.FlashError}}</span>
            </div>
            {{end}}

            <form action="/login" method="POST" class="md-col" style="gap:16px;">
                <div class="md-field">
                    <div class="md-field-box">
                        <input type="text" name="username" placeholder=" " required autofocus autocomplete="username" />
                        <label for="username">Username</label>
                    </div>
                </div>

                <div class="md-field">
                    <div class="md-field-box">
                        <input type="password" name="password" placeholder=" " required autocomplete="current-password" />
                        <label for="password">Kata sandi</label>
                    </div>
                </div>

                <button type="submit" class="md-btn" style="width:100%;height:48px;">Masuk ke dasbor</button>
            </form>

            <hr class="md-divider" style="margin-top:8px;">
            <div class="md-row md-wrap" style="justify-content:center;gap:12px;font-size:12px;color:var(--md-sys-color-on-surface-variant);">
                <a href="/about">Tentang</a>
                <span>&bull;</span>
                <a href="/terms">Ketentuan layanan</a>
                <span>&bull;</span>
                <a href="/privacy">Privasi</a>
            </div>
        </div>

        <p class="md-body-small md-mono md-text-center" style="margin-top:20px;color:var(--md-sys-color-on-surface-variant);">
            SiPenDosa daemon engine &copy; {{.CurrentYear}}
        </p>
    </div>

</body>
</html>
