<!DOCTYPE html>
<html lang="id" data-theme="night">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.Title}}</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.10/dist/full.min.css" rel="stylesheet" type="text/css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-base-300 min-h-screen flex items-center justify-center p-4 selection:bg-indigo-600 selection:text-white">

    <div class="card bg-base-100 shadow-2xl border border-base-content/10 max-w-md w-full">
        <div class="card-body p-8 space-y-6">
            
            <!-- Header Brand -->
            <div class="text-center space-y-2">
                <div class="inline-flex w-14 h-14 rounded-2xl bg-gradient-to-tr from-indigo-600 to-violet-500 items-center justify-center shadow-lg shadow-indigo-600/30 mb-1">
                    <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"></path></svg>
                </div>
                <h2 class="text-2xl font-black tracking-tight text-white">SiPenDosa Dashboard</h2>
                <p class="text-xs text-slate-400">Sistem Pengingat Dosen Saatnya — Rela "berdosa" demi mengingatkan dosen.</p>
            </div>

            {{if .FlashError}}
            <div class="alert alert-error text-sm py-2 px-3 shadow-lg">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                <span>{{.FlashError}}</span>
            </div>
            {{end}}

            <form action="/login" method="POST" class="space-y-4">
                <div class="form-control">
                    <label class="label"><span class="label-text text-xs font-semibold uppercase tracking-wider text-slate-300">Username</span></label>
                    <input type="text" name="username" placeholder="Masukkan username" required autofocus
                           class="input input-bordered bg-base-200 focus:input-primary text-sm font-medium w-full" />
                </div>

                <div class="form-control">
                    <label class="label"><span class="label-text text-xs font-semibold uppercase tracking-wider text-slate-300">Kata Sandi</span></label>
                    <input type="password" name="password" placeholder="••••••••" required
                           class="input input-bordered bg-base-200 focus:input-primary text-sm font-medium w-full" />
                </div>

                <button type="submit" class="btn btn-primary w-full shadow-lg shadow-indigo-600/30 text-white font-bold mt-2">
                    Masuk ke Sistem
                </button>
            </form>

            <div class="text-center text-xs text-slate-500 pt-2 border-t border-base-content/5">
                SiPenDosa Daemon Engine &copy; {{.CurrentYear}}
            </div>
        </div>
    </div>

</body>
</html>
