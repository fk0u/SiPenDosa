<!DOCTYPE html>
<html lang="id" data-theme="night" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.Title}} — SiPenDosa</title>

    <!-- Tailwind CSS & DaisyUI -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.10/dist/full.min.css" rel="stylesheet" type="text/css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'system-ui', '-apple-system', 'sans-serif'],
                        mono: ['JetBrains Mono', 'Menlo', 'monospace'],
                    }
                }
            }
        }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #07090e;
            color: #f1f5f9;
        }
        .bezel-card {
            background: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: inset 0 1px 1px 0 rgba(255, 255, 255, 0.08), 0 25px 50px -12px rgba(0, 0, 0, 0.7);
        }
        .bezel-outer {
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.1) 0%, rgba(255, 255, 255, 0.02) 100%);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
    </style>
</head>
<body class="min-h-[100dvh] flex items-center justify-center p-4 selection:bg-indigo-600 selection:text-white relative overflow-hidden">

    <!-- Ambient Glow Orbs -->
    <div class="fixed top-1/4 left-1/3 w-96 h-96 bg-indigo-600/15 rounded-full blur-[140px] pointer-events-none -z-10"></div>
    <div class="fixed bottom-1/4 right-1/3 w-96 h-96 bg-emerald-500/10 rounded-full blur-[140px] pointer-events-none -z-10"></div>

    <div class="w-full max-w-md">
        <div class="bezel-outer p-1.5 rounded-3xl">
            <div class="bezel-card rounded-[22px] p-8 space-y-6">
                
                <!-- Brand Header -->
                <div class="text-center space-y-2">
                    <div class="inline-flex w-14 h-14 rounded-2xl bg-indigo-600 items-center justify-center shadow-lg shadow-indigo-600/30 mb-2 border border-white/20">
                        <svg class="w-7 h-7 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"></path></svg>
                    </div>
                    <div class="flex items-center justify-center gap-2">
                        <h1 class="text-2xl font-extrabold tracking-tight text-white">SiPenDosa</h1>
                    </div>
                    <p class="text-xs text-slate-400 max-w-xs mx-auto">Sistem Pengingat Dosen Saatnya — Rela "berdosa" demi kepastian perkuliahan.</p>
                </div>

                {{if .FlashError}}
                <div class="p-3.5 rounded-xl bg-rose-500/10 border border-rose-500/20 flex items-start gap-2.5 text-xs text-rose-300">
                    <svg class="w-4 h-4 text-rose-400 flex-shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    <span>{{.FlashError}}</span>
                </div>
                {{end}}

                <form action="/login" method="POST" class="space-y-4">
                    <div class="space-y-1.5">
                        <label class="text-xs font-semibold text-slate-300">Username</label>
                        <input type="text" name="username" placeholder="Masukkan username admin" required autofocus
                               class="w-full px-3.5 py-2.5 rounded-xl bg-white/[0.03] border border-white/[0.08] focus:border-indigo-500/50 text-xs text-white placeholder-slate-500 outline-none transition" />
                    </div>

                    <div class="space-y-1.5">
                        <label class="text-xs font-semibold text-slate-300">Kata Sandi</label>
                        <input type="password" name="password" placeholder="••••••••" required
                               class="w-full px-3.5 py-2.5 rounded-xl bg-white/[0.03] border border-white/[0.08] focus:border-indigo-500/50 text-xs text-white placeholder-slate-500 outline-none transition" />
                    </div>

                    <button type="submit" class="w-full py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold shadow-lg shadow-indigo-600/30 transition-all active:scale-95 pt-2.5">
                        Masuk ke Dashboard
                    </button>
                </form>

                <!-- Footer Links -->
                <div class="pt-4 border-t border-white/[0.06] text-center space-y-2">
                    <div class="flex items-center justify-center gap-3 text-[11px] text-slate-400">
                        <a href="/about" class="hover:text-white transition">Tentang</a>
                        <span>&bull;</span>
                        <a href="/terms" class="hover:text-white transition">Ketentuan Layanan</a>
                        <span>&bull;</span>
                        <a href="/privacy" class="hover:text-white transition">Privasi</a>
                    </div>
                    <div class="text-[10px] text-slate-400 font-mono">
                        SiPenDosa Daemon Engine &copy; {{.CurrentYear}}
                    </div>
                </div>

            </div>
        </div>
    </div>

</body>
</html>
