{{define "content"}}
<div class="min-h-[75vh] flex items-center justify-center py-12 px-4">
    <!-- Double-Bezel Outer Shell -->
    <div class="relative w-full max-w-2xl rounded-[2.5rem] p-1.5 bg-gradient-to-b from-rose-500/25 via-amber-500/10 to-transparent ring-1 ring-rose-500/30 shadow-2xl">
        <div class="absolute -top-16 -left-16 w-48 h-48 bg-rose-600/25 rounded-full blur-3xl pointer-events-none"></div>
        <div class="absolute -bottom-16 -right-16 w-48 h-48 bg-amber-500/20 rounded-full blur-3xl pointer-events-none"></div>

        <!-- Inner Core Container -->
        <div class="relative bg-slate-950/80 backdrop-blur-2xl rounded-[calc(2.5rem-0.375rem)] p-8 md:p-12 text-center space-y-6 shadow-[inset_0_1px_1px_rgba(255,255,255,0.15)]">
            <div class="inline-flex items-center gap-2 px-4 py-1.5 rounded-full bg-rose-500/10 border border-rose-500/30 text-xs font-semibold tracking-wider uppercase text-rose-400">
                <span class="w-2 h-2 rounded-full bg-rose-400 animate-ping"></span>
                Error 500 • Kesalahan Server Internal
            </div>

            <div class="space-y-2">
                <h1 class="text-7xl md:text-9xl font-black tracking-tighter text-transparent bg-clip-text bg-gradient-to-b from-white via-slate-200 to-slate-500 select-none font-mono">
                    500
                </h1>
                <h2 class="text-xl md:text-2xl font-bold text-white tracking-tight">
                    Terjadi Kendala di Mesin Daemon SiPenDosa
                </h2>
            </div>

            <p class="text-sm md:text-base text-slate-400 max-w-[50ch] mx-auto leading-relaxed">
                Daemon pengingat mengalami gangguan sementara saat memproses permintaan. Jangan khawatir, database jadwal dan riwayat tetap aman tersimpan di SQLite WAL.
            </p>

            <div class="flex flex-wrap items-center justify-center gap-3 pt-4">
                <button onclick="window.location.reload()" class="group relative inline-flex items-center gap-3 px-6 py-3 rounded-full bg-gradient-to-r from-rose-600 to-rose-700 hover:from-rose-500 hover:to-rose-600 text-white font-semibold text-sm shadow-lg shadow-rose-950/50 transition-all duration-300 hover:scale-[1.02] active:scale-[0.98]">
                    <span>Muat Ulang Halaman</span>
                    <span class="w-6 h-6 rounded-full bg-white/20 flex items-center justify-center text-xs">
                        ↻
                    </span>
                </button>
                <a href="/logs" class="inline-flex items-center gap-2 px-5 py-3 rounded-full bg-white/5 hover:bg-white/10 text-slate-300 hover:text-white font-medium text-sm border border-white/10 transition-all duration-300">
                    Periksa Log Sistem
                </a>
                <button onclick="document.getElementById('help_modal').showModal()" class="inline-flex items-center gap-2 px-5 py-3 rounded-full bg-white/5 hover:bg-white/10 text-amber-300 hover:text-amber-200 font-medium text-sm border border-amber-500/20 transition-all duration-300">
                    Bantuan Pengembang
                </button>
            </div>
        </div>
    </div>
</div>
{{end}}
