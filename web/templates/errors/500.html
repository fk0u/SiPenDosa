{{define "content"}}
<div class="md-center" style="min-height:70vh; padding:24px 0;">
    <div class="md-card-elevated md-card-xl md-enter md-col md-text-center" style="max-width:640px; width:100%; align-items:center; gap:20px;">

        <span class="md-badge md-badge-error">
            <span class="md-dot md-dot-error"></span>
            Error 500 &bull; Kesalahan server internal
        </span>

        <div class="md-col" style="gap:4px;">
            <h1 class="md-display-small md-mono" style="font-size:88px; font-weight:400; line-height:1; letter-spacing:-2px; color:var(--md-sys-color-error); user-select:none;">500</h1>
            <h2 class="md-title-large md-balance">Terjadi kendala di mesin daemon SiPenDosa</h2>
        </div>

        <p class="md-body-medium md-muted md-balance" style="max-width:46ch;">
            Daemon pengingat mengalami gangguan sementara saat memproses permintaan. Jangan khawatir, database jadwal dan riwayat tetap aman tersimpan di SQLite WAL.
        </p>

        <div class="md-row md-wrap" style="justify-content:center; gap:12px; padding-top:8px;">
            <button onclick="window.location.reload()" class="md-btn">
                <svg style="width:16px;height:16px;" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
                Muat ulang halaman
            </button>
            <a href="/logs" class="md-btn-outlined">
                Periksa log sistem
            </a>
            <button onclick="document.getElementById('help_modal').showModal()" class="md-btn-text">
                <svg style="width:16px;height:16px;color:var(--md-sys-color-tertiary);" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M8.228 9c.549-1.165 2.03-2 3.772-2 2.21 0 4 1.343 4 3 0 1.4-1.278 2.575-3.006 2.907-.542.104-.994.54-.994 1.093m0 3h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                Bantuan pengembang
            </button>
        </div>

    </div>
</div>
{{end}}
